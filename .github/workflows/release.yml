name: Release

on:
  push:
    tags: ['v*']

jobs:
  gate:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

  # npm publishing is intentionally NOT in CI: publishing requires the owner's
  # 2FA (security key / Touch ID), so it is a manual step. This job only gates
  # the release and cuts the GitHub Release with platforms binaries.
  release-binaries:
    name: GitHub release with binaries
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Build release binaries
        run: npm run build:bin

      - name: Publish GitHub release with binaries
        uses: softprops/action-gh-release@v2
        with:
          name: soloknuckle ${{ github.ref_name }}
          body: |
            ## Soloknuckle ${{ github.ref_name }}

            Production hygiene CLI — pre-flight checks, secret scanning, agent firewall, MCP, and a rollback daemon.

            Install:
            \`curl -fsSL https://raw.githubusercontent.com/soch-ship-it/soloknuckle/main/install.sh | bash\`

            Or via npm: \`npm install -g soloknuckle\`

            Verify the package on npm: https://www.npmjs.com/package/soloknuckle
          files: dist-bin/soloknuckle-*.tar.gz
